<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云电脑入口跳转中</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0F172A;color:#E2E8F0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .box{text-align:center;padding:32px}
  .dot{width:10px;height:10px;border-radius:50%;background:#38BDF8;display:inline-block;margin-right:8px;
       animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  h1{font-size:20px;font-weight:600;margin:0 0 10px}
  p{font-size:13px;color:#94A3B8;margin:6px 0}
  a{color:#7DD3FC}
</style>
</head>
<body>
<div class="box">
  <h1><span class="dot"></span>正在查找云电脑最新地址…</h1>
  <p id="tip">如果一直停在这里，说明跳板读取失败，请稍后重试。</p>
</div>
<script>
(function () {
  var SOURCES = [
    { url: "https://api.github.com/repos/sunsunyong11/cloudpc-entry/contents/entry.json", wrap: true },
    { url: "entry.json", wrap: false }
  ];

  function pick(body) {
    var js = JSON.parse(body);
    if (js.host) return js.host;
    if (js.content) {
      var decoded = atob(js.content.replace(/\s/g, ""));
      return JSON.parse(decoded).host;
    }
    return null;
  }

  function go(host) {
    if (!host) return false;
    var target = "https://" + host + "/";
    document.getElementById("tip").innerHTML =
      '即将跳转到 <a href="' + target + '">' + host + "</a>";
    location.replace(target);
    return true;
  }

  function attempt(i) {
    if (i >= SOURCES.length) {
      document.getElementById("tip").textContent = "读取入口失败，请稍后刷新重试。";
      return;
    }
    var s = SOURCES[i];
    fetch(s.url, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (txt) {
        if (txt && go(pick(txt))) return;
        attempt(i + 1);
      })
      .catch(function () { attempt(i + 1); });
  }

  attempt(0);
})();
</script>
</body>
</html>
